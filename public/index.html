<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MealPilot</title>
<meta name="description" content="Plan the week's meals for your household, build the shopping list and see what it costs.">
<script src="theme.js" data-app="mealpilot"></script>
<meta name="theme-color" content="#1d5c6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#plan" aria-label="MealPilot home"><img src="icons/icon-192.png" alt=""><span>MealPilot</span></a>
  <div class="who" id="who"></div>
  <button class="theme-btn" type="button" onclick="AppTheme.open()" aria-label="Colour theme" title="Colour theme"><svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-2l-.3-.8c-.4-1.1.4-2.2 1.6-2.2H17a4 4 0 0 0 4-4c0-5-4-9-9-9Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></button>
</header>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2.2"/></svg><span>Plan</span></a>
  <a href="#menus" data-tab="menus"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg><span>Menus</span><i class="dot" id="menusDot" hidden></i></a>
  <a href="#recipes" data-tab="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14a7 7 0 0 1-14 0Z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg><span>Recipes</span></a>
  <a href="#shop" data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h2.2l2 10.5h10.6l2-7.5H7"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span>Shop</span><i class="count" id="shopCount" hidden></i></a>
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4Z"/><path d="M10 20v-5h4v5"/></svg><span>Household</span></a>
</nav>

<div class="banner" id="banner" hidden></div>

<main id="main">
  <section id="v-plan" class="view" aria-label="Plan"></section>
  <section id="v-menus" class="view" aria-label="Menus"></section>
  <section id="v-recipes" class="view" aria-label="Recipes"></section>
  <section id="v-shop" class="view" aria-label="Shopping"></section>
  <section id="v-home" class="view" aria-label="Household"></section>
</main>



<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
